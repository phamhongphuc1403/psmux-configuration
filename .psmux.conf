# ===========================================
# Plugins
# ===========================================
set -g @plugin 'psmux-plugins/ppm'
set -g @plugin 'psmux-plugins/psmux-sensible'
set -g @plugin 'psmux-plugins/psmux-resurrect'
set -g @plugin 'psmux-plugins/psmux-pain-control'
set -g @plugin 'psmux-plugins/psmux-prefix-highlight'
set -g @plugin 'psmux-plugins/psmux-continuum'

# Auto-save every 5 min, auto-restore on server start, start psmux on Windows login
set -g @continuum-save-interval '5'
set -g @continuum-restore 'on'
set -g @continuum-boot 'on'

# Restart Claude and nvim on restore, back into the same conversation / session.
# Their state is recorded per pane by a Claude SessionStart hook and
# lua/custom/plugins/psmux-session.lua, and snapshotted by scripts/pane-state-*.ps1.
# Restore types scripts/pane-resume.ps1 into every pane it rebuilds
# (@resurrect-pane-hook is a local patch, see patches/), so resurrect doesn't
# restart programs itself: the name it saves is unreliable while Claude runs a tool.
set -g @resurrect-processes 'false'
set -g @resurrect-pane-hook "& 'C:/Users/phuc.pham/psmux-configuration/scripts/pane-resume.ps1'"
# Snapshot loop starts on attach, like continuum's auto-save (-a appends, keeping continuum's hook).
set-hook -ga client-attached 'run-shell "pwsh -NoProfile -File \"C:/Users/phuc.pham/psmux-configuration/scripts/pane-state-loop.ps1\""'

# Prefix: Ctrl-Space (Ctrl-b is used by Claude Code / Neovim).
# Press Ctrl-Space twice to send it to the app (Neovim blink.cmp menu, PSReadLine MenuComplete).
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

set -g window-status-format "#I:#W#F(#{window_panes})"
set -g window-status-current-format "#I:#W#F(#{window_panes})"

bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# Initialize PPM (keep at the very bottom)
run '~/.psmux/plugins/ppm/ppm.ps1'

# Prefix + Ctrl-s: save the layout (resurrect) and the Claude/nvim pane state together.
# Comes after ppm so it replaces resurrect's own Ctrl-s binding.
bind C-s run-shell 'pwsh -NoProfile -File "C:/Users/phuc.pham/psmux-configuration/scripts/save-all.ps1"'
